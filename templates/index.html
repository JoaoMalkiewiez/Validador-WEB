<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Suporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .search-container { max-width: 800px; margin: 50px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-title { color: #0d6efd; font-weight: bold; display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .btn-buscar { background-color: #0d6efd; color: white; font-weight: bold; padding: 10px 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-container">
            <h2 class="header-title">🔎 Consultar Críticas de Suporte</h2>
            <form action="/criticas" method="GET" class="d-flex gap-2">
                <input type="text" name="busca" class="form-control form-control-lg" placeholder="Digite o erro ou palavra-chave..." required>
                <button type="submit" class="btn btn-buscar text-uppercase">Buscar</button>
            </form>
        </div>
    </div>
</body>
</html>
